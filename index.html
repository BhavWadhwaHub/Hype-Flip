<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hype Flip: flip sneakers, win drops and build a resale empire.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Hype Flip</title>
<meta name="theme-color" content="#2D2494">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{
  color-scheme: light;
  --ink:#1A1640;
  --deep:#0E0B33;
  --paper:#FFFFFF;
  --soft:#F5F2FF;
  --ground:#241E6B;
  --muted:#6F6A99;
  --lav:#C9C2F7;
  --line:#E0DBF5;
  --box:#FF6A1A;
  --box-deep:#C8440A;
  --gold:#FFD23F;
  --gold-d:#D48F00;
  --green:#34D073;
  --green-d:#11914A;
  --up:#0F9A4D;
  --down:#E5383B;
  --blue:#3D8BFF;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS","Segoe UI",sans-serif;
  --mono:"Nunito","Trebuchet MS","Segoe UI",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 55% at 50% 0%,#5142D6 0%,#2D2494 42%,#17134A 100%) fixed #17134A;color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed}
.num{font-family:var(--body);font-weight:900;font-variant-numeric:tabular-nums}
img.pic{display:block;-webkit-user-drag:none;user-select:none}
img.shoe.pic{width:100%;height:auto;aspect-ratio:2/1;object-fit:contain}
img.face.pic{width:100%;height:100%;object-fit:cover}
.shoe{width:100%;height:auto;display:block;overflow:visible}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}
.logo{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:.9;letter-spacing:.01em;transform:rotate(-3deg);display:flex;gap:6px;text-shadow:0 3px 0 var(--deep)}
.logo span:first-child{color:#fff}
.logo span:last-child{color:var(--gold)}
.pill{display:flex;align-items:center;gap:7px;background:rgba(14,11,51,.6);border:2.5px solid var(--deep);border-radius:999px;padding:4px 14px 4px 5px;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.pill svg{width:28px;height:28px;flex:none}
.cash{font-family:var(--display);font-weight:400;font-size:23px;line-height:1;font-variant-numeric:tabular-nums;transform-origin:left center;display:inline-block}

/* HUD card */
.hud{margin-top:10px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--deep);display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.avatar{width:62px;height:72px;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:linear-gradient(#FFB45E,#FF6A1A);padding:0;box-shadow:0 3px 0 var(--ink)}
.hudmid{min-width:0}
.pname{font-family:var(--display);font-weight:400;font-size:23px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagechip{display:inline-block;margin-top:6px;background:var(--ink);color:var(--gold);font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:999px;white-space:nowrap}
.stats{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:2px solid var(--line);padding-top:8px}
.stats div{display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:10px;padding:4px 6px}
.stats b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.15}
.lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tapwrap{position:relative;display:flex;align-items:center;justify-content:center;padding:4px 2px 8px}
.tap{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#FFF3A8 0%,#FFD23F 45%,#FFA91F 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--ink);box-shadow:0 6px 0 var(--gold-d),0 6px 0 3px var(--ink);transition:transform .05s}
.tap:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gold-d),0 1px 0 3px var(--ink)}
.tap b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em}
.tap small{font-size:11.5px;font-weight:900}
.float{position:absolute;pointer-events:none;font-family:var(--display);color:var(--up);animation:rise .8s ease-out forwards;font-size:16px;text-shadow:0 1.5px 0 #fff}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-48px)}}

.boost{margin-top:12px;display:flex;gap:8px;align-items:stretch}
.boost button{flex:1;border:2.5px solid var(--deep);border-radius:14px;padding:9px 12px;background:linear-gradient(#7B6BFF,#4B3BD6);color:#fff;font-weight:900;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:6px;box-shadow:0 4px 0 var(--deep),inset 0 2px 0 rgba(255,255,255,.25);text-shadow:0 1.5px 0 rgba(0,0,0,.3)}
.boost button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.boost button .adtag{font-size:10px;font-weight:900;background:var(--gold);color:var(--ink);padding:2px 7px;border-radius:999px;text-shadow:none;white-space:nowrap}
.boost button.on{background:linear-gradient(#5BE58F,#1FB862)}
.goals{flex:0 0 auto!important;background:linear-gradient(#FF9A3D,#FF5B14)!important;gap:8px!important}
.goals b{background:rgba(14,11,51,.35);padding:1px 7px;border-radius:999px;font-size:12px}
.goals.ready{background:linear-gradient(#FFE27A,#FFB300)!important;color:var(--ink)!important;text-shadow:none!important;animation:nudge 1.6s infinite}
.goals.ready b{background:var(--ink);color:#fff}
@keyframes nudge{0%,80%,100%{transform:none}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}

.ticker{margin-top:10px;background:var(--deep);color:#fff;border-radius:999px;border:2px solid #3A30A8;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:800;display:flex}
.ticker .tag{background:var(--box);color:#fff;font-weight:900;padding:5px 10px;flex:none;letter-spacing:.05em;border-radius:999px;font-size:11px;align-self:center;margin:2px}
.ticker .track{overflow:hidden;flex:1;position:relative}
.ticker .run{display:inline-block;padding:6px 0 6px 100%;animation:marquee 28s linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
.ticker.flash .tag{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:var(--gold);color:var(--ink)}}

/* Scene */
.scene{position:relative;margin-top:10px;aspect-ratio:360/232;max-width:100%;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#CFC6EC;box-shadow:0 5px 0 var(--deep)}
.scene .bg,.scene .bg svg,.scene canvas.c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.who{position:absolute;aspect-ratio:100/160}
.who svg{width:100%;height:100%;display:block;transform-origin:50% 100%}
.who.idle svg{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5%) scaleY(1.01)}}
.tagname{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);font-size:10.5px;font-weight:900;background:var(--ink);color:#fff;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1.5px solid #fff}
#ptag{bottom:auto;transform:translate(-50%,-30%);z-index:2;pointer-events:none}
.who.cust{left:108%;bottom:3%;height:62%;transition:left 1.1s cubic-bezier(.2,.8,.3,1)}
.who.cust.in{left:63%}
.who.cust.out{left:112%;transition-timing-function:ease-in}
.who.walking svg{animation:walk .32s ease-in-out infinite!important}
@keyframes walk{50%{transform:translateY(-4%) rotate(2deg)}}
.bubble{position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 9px;font-size:12.5px;font-weight:800;line-height:1.25;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:3;box-shadow:0 3px 0 rgba(14,11,51,.45)}
.bubble.cb{right:3%;top:4%;max-width:46%}
.bubble.pb{left:3%;top:6%;max-width:40%;font-family:var(--display);font-weight:400;font-size:16px;text-transform:uppercase}
.scene.is3d .bubble{right:auto;transform:translate(-50%,-100%);width:max-content}
.scene.is3d .bubble.cb{max-width:52%}
.bubble.cb .btn{padding:4px 8px;font-size:11.5px}
.courier{position:absolute;top:-30%;width:15%;min-width:44px;z-index:3;animation:dropin .7s cubic-bezier(.3,1.5,.5,1) forwards,hover 1.4s .7s ease-in-out infinite;display:flex;flex-direction:column;align-items:center}
.courier svg{width:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.courier span{font-size:10px;font-weight:900;background:var(--gold);color:var(--ink);padding:1px 7px;border-radius:999px;margin-top:2px;border:2px solid var(--ink)}
.courier.c3{animation:none;width:84px;height:84px;transform:translate(-50%,-50%);justify-content:flex-end}
.courier.c3 svg{display:none}
.courier.c3 span{animation:hover 1s ease-in-out infinite}
@keyframes dropin{to{top:44%}}
@keyframes hover{50%{transform:translateY(-5px) rotate(-3deg)}}

main{flex:1;padding-block:16px 96px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:400;font-size:25px;line-height:1;margin:0;letter-spacing:.01em;color:#fff;text-shadow:0 2.5px 0 var(--deep);text-wrap:balance}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sechead .lbl{white-space:nowrap}
main>section>.sechead .lbl,.listings>.hint,main>section>.hint,main>section>p.note{color:var(--lav)}
.hint{color:var(--muted);font-size:13px;font-weight:700;margin:0}

/* Buttons */
.btn{border:2.5px solid var(--ink);border-radius:12px;padding:9px 13px;font-weight:900;font-size:14px;background:linear-gradient(#FFFFFF,#E6E0FF);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1;box-shadow:0 3.5px 0 var(--ink);transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 .5px 0 var(--ink)}
.btn.primary{background:linear-gradient(#62EA97,#1DB55F);color:#fff;text-shadow:0 1.5px 0 rgba(0,0,0,.3)}
.btn.dark{background:linear-gradient(#FFA24A,#FF5B14);color:#fff;text-shadow:0 1.5px 0 rgba(0,0,0,.3)}
.btn.small{padding:6px 10px;font-size:12.5px;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{background:linear-gradient(#EEECF5,#D5D1E3);color:#8F8AAE;text-shadow:none;border-color:#8F8AAE;box-shadow:0 3px 0 #8F8AAE}
.btn .num{font-weight:900}

/* Cards */
.listing,.pair,.order,.bench,.setcard,.offer,.list,.market,.dropcard,.shelfct{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--deep)}
.sources{display:grid;gap:10px}
.binrow{display:flex;gap:10px;align-items:stretch}
.binbtn{flex:1;text-align:left;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#FFA24A,#FF5B14);color:#fff;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 5px 0 var(--box-deep),0 5px 0 3px var(--ink);text-shadow:0 1.5px 0 rgba(0,0,0,.28);transition:transform .05s}
.binbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--box-deep),0 1px 0 3px var(--ink)}
.binbtn:disabled{filter:grayscale(.85);opacity:.75}
.binbtn b{font-family:var(--display);font-weight:400;font-size:21px;display:block;line-height:1}
.binbtn small{font-size:12px;font-weight:800}
.binbtn>.num{background:#fff;color:var(--ink);text-shadow:none;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);font-size:14px}
.shelfct{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:74px}
.shelfct b{font-family:var(--display);font-weight:400;font-size:21px}

.listings{display:grid;gap:8px}
.listing{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-width:2.5px}
.listing>div:first-child{background:var(--soft);border-radius:10px;padding:2px}
.listing .nm{font-weight:900;font-size:13.5px;line-height:1.2}
.listing .meta{font-size:12px;color:var(--muted)}
.deal{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.deal.good{color:var(--up)}
.deal.sus{color:var(--down)}

.pairs{display:grid;gap:12px}
.pair{position:relative;display:grid;grid-template-columns:106px 1fr;overflow:hidden}
.pair .art{display:flex;align-items:center;justify-content:center;padding:6px;border-right:3px solid var(--ink);background:radial-gradient(circle at 50% 42%,#F4F1FB,#BEB8D0)}
.pair.rar1 .art{background:radial-gradient(circle at 50% 42%,#FFFFFF,#B9C6EE)}
.pair.rar2 .art{background:radial-gradient(circle at 50% 42%,#E2FFEC,#3FCF7C)}
.pair.rar3 .art{background:radial-gradient(circle at 50% 42%,#DCEBFF,#3D8BFF)}
.pair.rar4 .art{background:radial-gradient(circle at 50% 42%,#F0E3FF,#9B5CFF)}
.pair.rar5 .art{background:radial-gradient(circle at 50% 42%,#FFF8CC,#FFB300)}
.pair .info{padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pair .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pair .nm{font-weight:900;font-size:14px;line-height:1.15}
.pair .code{font-size:10.5px;color:var(--muted);letter-spacing:.03em;font-weight:800}
.pair .val{text-align:right;flex:none}
.pair .val b{font-family:var(--display);font-weight:400;font-size:19px;display:block;line-height:1.05}
.pl{font-size:11.5px;font-weight:900}
.pl.up{color:var(--up)} .pl.down{color:var(--down)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid currentColor;border-radius:999px;padding:1px 7px;font-weight:900}
.chip.fill{color:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{border:2.5px dashed rgba(255,255,255,.4);background:rgba(255,255,255,.07);border-radius:16px;padding:20px 16px;text-align:center;color:var(--lav);font-weight:800}
.hotflag{display:none;position:absolute;top:0;right:0;background:var(--box);color:#fff;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);border-radius:0 0 0 12px;font-size:10px;font-weight:900;padding:2px 8px;z-index:1}
.pair.hot{box-shadow:0 4px 0 var(--deep),0 0 0 4px var(--gold);animation:hotpulse 1.2s ease-in-out infinite}
.pair.hot .hotflag{display:block}
@keyframes hotpulse{50%{box-shadow:0 4px 0 var(--deep),0 0 0 7px rgba(255,210,63,.45)}}

/* Market */
.stagecard{background:linear-gradient(135deg,#FF8A3D,#FF4F7B);color:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--deep);padding:14px;display:grid;gap:10px}
.stagecard h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1;text-shadow:0 2.5px 0 rgba(14,11,51,.45)}
.stagecard .lbl{color:rgba(255,255,255,.92)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#FFE27A,#FFA91F);border-radius:999px}
.stagecard .bar{background:rgba(14,11,51,.35)}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.market{display:grid;gap:0;overflow:hidden}
.mgroup{display:flex;justify-content:space-between;gap:8px;background:var(--ink);color:var(--gold);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:7px 12px}
.mrow{display:grid;grid-template-columns:62px 1fr 78px 64px;gap:8px;align-items:center;padding:8px 10px;border-bottom:2px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .nm{font-weight:900;font-size:13px;line-height:1.15}
.mrow .sub{font-size:11px;color:var(--muted);font-weight:800}
.mrow .mult{font-family:var(--display);font-weight:400;font-size:17px;text-align:right}
.mrow .mult small{display:block;font-family:var(--body);font-size:10.5px;font-weight:800;color:var(--muted)}
.mrow.locked{opacity:.5}
.spark{width:100%;height:30px;display:block}

/* Hustles */
.list{display:grid;overflow:hidden}
.hrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:2px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .nm{font-weight:900;font-size:14.5px}
.hrow .sub{font-size:12px;color:var(--muted)}
.lvl{font-size:10.5px;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.hired{font-size:12px;font-weight:900;color:var(--up)}
.staffrow{grid-template-columns:48px 1fr auto}
.mini{width:48px;height:54px;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.mini svg{width:100%;height:100%;display:block}

/* Drop */
.dropcard{overflow:hidden}
.dropcard .hero{background:radial-gradient(circle at 50% 45%,#FFD9A8,#FF6A1A);padding:18px 16px 8px;border-bottom:3px solid var(--ink);position:relative}
.dropcard .live{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--gold);font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;letter-spacing:.06em;z-index:1}
.dropcard .body{padding:14px;display:grid;gap:10px}
.dropcard h2{color:var(--ink);text-shadow:none}
.tickets{display:flex;gap:6px;align-items:center}
.tkt{width:36px;height:22px;border:2.5px solid var(--ink);border-radius:6px;background:linear-gradient(#FFE27A,#FFB300);position:relative}
.tkt.empty{background:transparent;border-style:dashed;border-color:var(--muted)}
.tkt::after{content:"";position:absolute;right:7px;top:2px;bottom:2px;border-left:2px dotted var(--ink)}
.tkt.empty::after{display:none}

/* Store */
.store{display:grid;gap:10px}
.offer{padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.offer.hot{background:linear-gradient(#FFE98F,#FFC21F)}
.offer .nm{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.offer p{margin:4px 0 0;font-size:12.5px;font-weight:700}
.note{font-size:12.5px;color:var(--muted);border-left:4px solid var(--box);padding-left:10px}

/* Tabs */
.tabs{position:sticky;bottom:0;margin-inline:-16px;background:var(--deep);border-top:3px solid #3A30A8;border-radius:20px 20px 0 0;display:grid;grid-template-columns:repeat(5,1fr);padding:4px 6px env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{color:#9088DA;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;position:relative}
.tabs button svg{width:26px;height:26px;padding:2px;transition:transform .12s}
.tabs button[aria-selected="true"]{color:#fff}
.tabs button[aria-selected="true"] svg{background:linear-gradient(#FFA24A,#FF5B14);border-radius:12px;width:38px;height:38px;padding:6px;box-shadow:0 3px 0 var(--box-deep),0 0 0 2.5px var(--deep);transform:translateY(-9px);margin-bottom:-9px}
.dot{position:absolute;top:4px;right:22%;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--deep)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(14,11,51,.8);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--deep);width:100%;max-width:448px;max-height:92vh;overflow:auto;padding:16px;display:grid;gap:12px;animation:up .22s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(30px) scale(.96);opacity:.4}}
.sheet h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1}
.timer{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(#FFA24A,#FF5B14);transition:width .1s linear;border-radius:999px}
.cmp{display:grid;gap:8px}
.cmp figure{margin:0;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff}
.cmp figcaption{font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cmp .suspect{border:3px solid var(--ink)}
.suspect .hit{cursor:crosshair}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cleanbox{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px}
.cleanbox canvas{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);touch-action:none;cursor:grab}
.bigstat{font-family:var(--display);font-weight:400;font-size:46px;text-align:center;line-height:1}
.linebox{background:var(--ink);color:#fff;border-radius:14px;padding:14px;text-align:center}
.linebox .num{font-family:var(--display);font-weight:400;font-size:48px}
.racebtn{width:100%;height:120px;border-radius:18px;background:linear-gradient(#FFA24A,#FF5B14);color:#fff;border:3px solid var(--ink);font-family:var(--display);font-weight:400;font-size:34px;box-shadow:0 7px 0 var(--box-deep),0 7px 0 3px var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.3);touch-action:manipulation;user-select:none}
.racebtn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--box-deep),0 1px 0 3px var(--ink)}
.racebtn:disabled{filter:grayscale(.6)}
.adscreen{background:var(--ink);color:#fff;border-radius:14px;padding:28px 16px;text-align:center}

#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;padding-inline:16px}
.toast{background:var(--deep);color:#fff;border:2.5px solid #5B4FE0;border-radius:14px;padding:9px 13px;font-size:13px;font-weight:800;max-width:440px;width:100%;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:up .2s ease-out}
.toast.good{border-color:var(--green)}
.toast.bad{border-color:var(--down)}

/* Dialogue + creator */
.dlg{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start}
.portrait{border:3px solid var(--ink);border-radius:16px;height:142px;overflow:hidden;background-image:radial-gradient(rgba(26,22,64,.12) 1.2px,transparent 1.5px);background-size:7px 7px;box-shadow:0 4px 0 var(--ink)}
.portrait svg{width:100%;height:100%;display:block}
.dname{font-family:var(--display);font-weight:400;font-size:25px;line-height:1}
.say{margin:10px 0 0;background:var(--soft);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:800;position:relative}
.say::before{content:"";position:absolute;left:-11px;top:14px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.creator{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:end}
.cprev{height:150px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#FFC27A,#FF6A1A);overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.cprev svg{width:100%;height:100%;display:block}
.cfields{display:grid;gap:4px}
.cfields input{font:inherit;font-weight:900;font-size:17px;border:2.5px solid var(--ink);border-radius:12px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
#copts{display:grid;gap:8px}
.optrow{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--box)}
.tx{border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;text-transform:capitalize;background:#fff}
.tx[aria-pressed="true"]{background:var(--ink);color:#fff}
.kline{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:#EEE6FF;border:2.5px solid var(--ink);border-radius:14px;padding:6px 8px;margin-top:10px}
.kp{height:60px;border-radius:10px;overflow:hidden}
.kp svg{width:100%;height:100%;display:block}
.kline p{margin:0;font-weight:800;font-size:13.5px}

/* Juice */
.cash.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18);color:var(--gold)}}
.coin{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3A8,#FFC21F);border:2px solid var(--ink);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none;color:var(--ink)}
.spk{position:fixed;left:0;top:0;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:3px;z-index:40;pointer-events:none;border:1.5px solid var(--ink)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
body.quake .app{animation:quake .5s}
@keyframes quake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.combo{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--box);color:#fff;border:2.5px solid var(--ink);border-radius:999px;font-family:var(--display);font-size:13px;padding:0 9px;white-space:nowrap;z-index:2}
.combo.pop{animation:cpop .3s cubic-bezier(.2,1.8,.4,1)}
@keyframes cpop{from{transform:translateX(-50%) scale(1.6)}}
.tap.fire{animation:flick .4s infinite alternate}
@keyframes flick{from{box-shadow:0 6px 0 var(--gold-d),0 6px 0 3px var(--ink),0 0 18px 4px rgba(255,106,26,.75)}to{box-shadow:0 6px 0 var(--gold-d),0 6px 0 3px var(--ink),0 0 30px 10px rgba(255,106,26,.9)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twk 1s ease-in-out infinite}
@keyframes twk{50%{transform:scale(.4) rotate(45deg);opacity:.5}}
.glint{transform-box:fill-box;transform-origin:center;animation:twk 1.4s ease-in-out infinite}

/* Reveal */
.reveal{position:relative;background:radial-gradient(circle at 50% 40%,#4A3BC4,#0E0B33);border:3px solid var(--ink);border-radius:18px;overflow:hidden;padding:16px 12px 18px;text-align:center;color:#fff;cursor:pointer}
.rays{position:absolute;left:50%;top:40%;width:620px;height:620px;margin:-310px 0 0 -310px;background:repeating-conic-gradient(var(--rc) 0deg 9deg,transparent 9deg 22deg);opacity:0;transition:opacity .4s;animation:spin 9s linear infinite;border-radius:50%}
.reveal.open .rays{opacity:.5}
.r0.open .rays,.r1.open .rays{opacity:.15}
@keyframes spin{to{transform:rotate(360deg)}}
.rstage{position:relative;height:170px;display:flex;align-items:center;justify-content:center}
.rbox{position:absolute;width:150px;animation:boxshake .14s linear infinite;transition:transform .45s ease-in,opacity .35s}
.r4 .rbox,.r5 .rbox{animation-duration:.08s}
@keyframes boxshake{25%{transform:rotate(-4deg) translateX(-3px)}75%{transform:rotate(4deg) translateX(3px)}}
.rbox .lid{transition:transform .45s cubic-bezier(.3,0,.6,1);transform-box:fill-box;transform-origin:left bottom}
.reveal.open .rbox{animation:none;transform:translateY(60px) scale(.7);opacity:0}
.reveal.open .rbox .lid{transform:translate(40px,-60px) rotate(-40deg)}
.rshoe{position:relative;width:270px;max-width:90%;transform:scale(0) rotate(-14deg);transition:transform .6s cubic-bezier(.2,1.7,.4,1) .12s;filter:drop-shadow(0 0 14px var(--rc)) drop-shadow(0 0 5px var(--rc))}
.rshoe canvas.spin3d{width:100%;height:auto;display:block}
.reveal.open .rshoe{transform:scale(1)}
.rlabel{position:relative;height:46px;margin-top:4px}
.rlabel span{display:inline-block;background:var(--rc);border:3px solid #fff;border-radius:12px;color:#fff;font-family:var(--display);font-size:32px;text-transform:uppercase;padding:0 16px;opacity:0;transform:scale(3) rotate(8deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1) .45s,opacity .2s .45s;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.reveal.open .rlabel span{opacity:1;transform:scale(1) rotate(-3deg)}
.rname{position:relative;font-weight:900;font-size:16px;opacity:0;transform:translateY(8px);transition:.35s .7s}
.rname small{display:block;font-size:12px;color:var(--lav);font-weight:800;margin-top:2px}
.reveal.open .rname{opacity:1;transform:none}

/* Goals + streak */
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sday{border:2px solid var(--line);border-radius:10px;padding:5px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;background:var(--soft)}
.sday .lbl{font-size:8.5px;letter-spacing:.03em}
.sday b{font-size:10px;line-height:1.1;font-weight:900}
.sday.done{background:var(--green);color:#fff;border-color:var(--green-d)}
.sday.done .lbl{color:rgba(255,255,255,.9)}
.sday.today{background:linear-gradient(#FFE27A,#FFB300);border:2.5px solid var(--ink);animation:glowpulse 1.2s infinite}
@keyframes glowpulse{50%{box-shadow:0 0 0 5px rgba(255,210,63,.45)}}
.qlist{display:grid;gap:8px}
.quest{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:9px 10px;background:var(--soft)}
.quest .nm{font-weight:900;font-size:14px;margin-bottom:5px}
.quest .bar{height:8px;margin-bottom:4px;background:#fff}
.quest.claimed{opacity:.55}
.chest{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:2.5px dashed var(--ink);border-radius:14px;padding:10px}
.chest b{font-size:13.5px;grid-column:1}
.chest .lbl{grid-column:1}
.chest>button,.chest>.hired{grid-column:2;grid-row:1 / span 2}
.chest.ready{border-style:solid;background:linear-gradient(#FFE98F,#FFC21F);animation:glowpulse 1.2s infinite}

/* Orders, lab, sets */
.olist,.benches{display:grid;gap:10px;margin-top:8px}
.order{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 10px}
.order.ready{background:#FFF6DB;box-shadow:0 4px 0 var(--deep),0 0 0 4px var(--gold)}
.oface{width:52px;height:60px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(#E9DDFF,#C9B8FF)}
.oface svg{width:100%;height:100%;display:block}
.obody{min-width:0;display:grid;gap:2px}
.owho{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.owho b{font-size:14px;font-weight:900}
.omult{font-size:10.5px;background:var(--up);color:#fff;padding:1px 7px;border-radius:999px;white-space:nowrap}
.oreq{font-weight:900;font-size:13px;line-height:1.2}
.oline{font-size:12px;color:var(--muted);font-style:italic;font-weight:700}
.otime{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-top:2px}
.otime .bar{height:7px}
.otime .bar i.low{background:var(--down)}
.otime .num{font-size:11px}
.order .btn{flex-direction:column;gap:1px;min-width:78px}
.order .btn .num{font-size:11px}
.bench{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:8px 10px}
.bench b{font-size:13.5px;font-weight:900}
.bench.emptyb{grid-template-columns:1fr;border:2.5px dashed rgba(255,255,255,.4);background:rgba(255,255,255,.07);box-shadow:none;color:var(--lav);font-size:12.5px;padding:12px}
.bench.emptyb b{color:#fff}
.bench.lockedb{grid-template-columns:1fr auto;opacity:.92}
.bench.lockedb .hint{display:block;font-size:12px}
.bench.readyb{background:#FFF6DB;box-shadow:0 4px 0 var(--deep),0 0 0 4px var(--gold);animation:hotpulse 1.2s infinite}
.bthumb{background:var(--soft);border-radius:10px;padding:2px}
.bbody{min-width:0;display:grid;gap:4px}
.labprev{background:radial-gradient(circle at 50% 45%,#fff,#E6E0FF);border:3px solid var(--ink);border-radius:14px;padding:8px}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setcard{padding:8px;display:grid;gap:6px;border-width:2.5px;border-radius:14px}
.setcard.done{background:linear-gradient(#FFE98F,#FFC21F)}
.setcard.locked{opacity:.55}
.sethead{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.sethead b{font-size:13px;line-height:1.15;font-weight:900}
.sethead .num{font-size:11px}
.setthumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.setthumbs>div{background:var(--soft);border-radius:7px;padding:1px}
.setcard.done .setthumbs>div{background:rgba(255,255,255,.7)}
.setthumbs.big{grid-template-columns:repeat(2,1fr);gap:6px}
.setthumbs.big>div{padding:4px;border-radius:12px}
.setfoot{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.setcard.done .setfoot{color:var(--ink)}

/* Tutorial */
#tut{position:fixed;inset:0;z-index:15;pointer-events:none}
.tuthole{position:fixed;border-radius:16px;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px rgba(14,11,51,.62);transition:left .15s,top .15s,width .15s,height .15s;animation:tutring 1s ease-in-out infinite}
@keyframes tutring{50%{box-shadow:0 0 0 9px rgba(255,210,63,.55),0 0 0 9999px rgba(14,11,51,.62)}}
.tuthand{position:fixed;width:44px;height:44px;margin-left:-22px;animation:tutbob .7s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(14,11,51,.5))}
.tuthand.down{transform:rotate(180deg);animation-name:tutbobd}
@keyframes tutbob{50%{transform:translateY(8px)}}
@keyframes tutbobd{50%{transform:rotate(180deg) translateY(8px)}}
.tuttip{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--deep);padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;pointer-events:auto}
.tutface{width:52px;height:60px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#F3DEC4}
.tutface svg{width:100%;height:100%;display:block}
.tuttip p{margin:0;font-size:14.5px;font-weight:800;line-height:1.3}
.tutfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.tutfoot .num{font-size:11px;color:var(--muted)}
#tutskip{font-size:12px;font-weight:900;color:var(--muted);text-decoration:underline;padding:2px 0}

@media (max-width:370px){
  .sets{grid-template-columns:1fr}
  .mrow{grid-template-columns:50px 1fr 60px 56px}
  .cash{font-size:20px}
  .logo{font-size:26px}
  .tap{width:76px;height:76px}
  .tap b{font-size:15px}
  .boost button{font-size:12.5px;padding:9px 10px}
  .hud{grid-template-columns:54px 1fr auto}
  .avatar{width:54px;height:64px}
}
@media (prefers-reduced-motion:reduce){
  .bench.readyb,.pair.hot,.goals.ready,.sday.today,.chest.ready,.twinkle,.glint,.rays,.courier,.tap.fire,.tuthole,.tuthand{animation:none!important}
  .who.idle svg{animation:none}.who.cust{transition:none}
  .ticker .run{animation-duration:80s}
  .float,.sheet,.toast{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="logo" aria-label="Hype Flip"><span>HYPE</span><span>FLIP</span></h1>
    <div class="pill" title="Cash">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="#FFC21F" stroke="#0E0B33" stroke-width="2"/><circle cx="14" cy="14" r="8.5" fill="#FFE27A"/><text x="14" y="19" text-anchor="middle" font-family="Arial" font-weight="900" font-size="13" fill="#8A5A00">$</text></svg>
      <span class="cash" id="cash">$40</span>
    </div>
  </header>
  <section class="hud" aria-label="Your stats">
    <button class="avatar" id="hudav" aria-label="Edit your character"></button>
    <div class="hudmid">
      <div class="pname" id="hudname">Rookie</div>
      <div class="stagechip" id="stagechip">Bedroom Flipper</div>
    </div>
    <div class="tapwrap" id="tapwrap">
      <button class="tap" id="tap" aria-label="Hustle for cash"><b>HUSTLE</b><small class="num" id="tapv">+$1</small></button><span class="combo" id="combo" hidden></span>
    </div>
    <div class="stats">
      <div><span class="lbl">Per sec</span><b id="ips">$0</b></div>
      <div><span class="lbl">Net worth</span><b id="nw">$40</b></div>
      <div><span class="lbl">Clout</span><b id="clout">0</b></div>
    </div>
  </section>
  <div class="boost">
    <button id="boostbtn"><span id="boosttxt">2× income · 2 min</span><span class="adtag">WATCH AD</span></button>
    <button id="goalsbtn" class="goals" aria-label="Daily goals and streak"><span>Goals</span><b class="num" id="goalsct">0/3</b></button>
  </div>
  <div class="ticker" aria-label="Hype Wire news">
    <div class="tag">HYPE WIRE</div>
    <div class="track"><div class="run" id="ticker">Market is open.</div></div>
  </div>

  <section class="scene" id="scene" aria-label="Your shop">
    <div class="bg" id="scenebg"></div>
    <div id="scenecast"></div>
    <div id="custwrap"></div>
    <div class="bubble pb" id="pbubble" hidden></div>
    <span class="tagname" id="ptag" hidden></span>
  </section>
  <main id="view"></main>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="stash" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8h18v12H3z"/><path d="M2 4h20v4H2z"/><path d="M10 12h4"/></svg>Stash</button>
    <button role="tab" data-tab="market" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg>Market</button>
    <button role="tab" data-tab="hustle" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3v18"/><path d="M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/></svg>Hustle</button>
    <button role="tab" data-tab="drop" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg>Drop<span class="dot" id="dropdot" hidden></span></button>
    <button role="tab" data-tab="store" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 2l-2 5v13h16V7l-2-5z"/><path d="M4 7h16"/><path d="M16 11a4 4 0 0 1-8 0"/></svg>Store</button>
  </nav>
</div>

<div id="tut" hidden>
  <div class="tuthole" id="tuthole"></div>
  <svg class="tuthand" id="tuthand" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 3 L37 22 L28 22 L28 40 L16 40 L16 22 L7 22 Z" fill="#FFD23F" stroke="#1A1640" stroke-width="3" stroke-linejoin="round"/></svg>
  <div class="tuttip" id="tuttip">
    <div class="tutface" id="tutface"></div>
    <div><p id="tuttxt"></p><div class="tutfoot"><span class="num" id="tutstep"></span><button id="tutskip">Skip tutorial</button></div></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const now = () => Date.now()/1000;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function hash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function srand(seed){let t=(seed+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function fmt(n){
  const neg=n<0; n=Math.abs(n);
  let s;
  if(n<1000) s=n<10&&n%1? n.toFixed(2) : Math.floor(n).toLocaleString('en-US');
  else{const u=['K','M','B','T','aa','ab','ac'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}s=(n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+u[i]}

function eventAt(t){
  const slot=Math.floor(t/50);if(t-slot*50>40)return null;
  const pool=MODELS.filter(m=>m.stage===S.stage);
  const r1=srand(hash('ev'+slot)),r2=srand(hash('ev2'+slot)),r3=srand(hash('ev3'+slot));
  const m=pool[Math.floor(r1*pool.length)];const spike=r2<.72;
  return{slot,id:m.id,amt:spike?1+r3*.8:-.35,spike,celeb:CELEBS[Math.floor(r3*CELEBS.length)]};
}

  const p=m.hp;
  let h=1+p.A*Math.sin(6.283*t/p.P+p.ph)+p.B*Math.sin(6.283*t/(p.P/5)+p.ph2);
  h+=(srand(hash(m.id+'n'+Math.floor(t/8)))-.5)*.12;
  const e=eventAt(t);if(e&&e.id===m.id)h+=e.amt;
  return clamp(h,.6,3.5);
}

  let x=rng()*tot,rr=rars[0];
  for(const r of rars){x-=RAR[r].w;if(x<=0){rr=r;break}}
  const opts=pool.filter(m=>m.rar===rr);return opts[Math.floor(rng()*opts.length)];

/* ================= 3D ENGINE ================= */
const T3=window.THREE||null;
let G3=null;
function init3D(){
  if(!T3)return false;
  try{
    const c=document.createElement('canvas');
    const r=new T3.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true});
    r.setPixelRatio(1);r.setClearColor(0x000000,0);
    const sc=new T3.Scene();
    sc.add(new T3.HemisphereLight(0xffffff,0x9a90c8,.78));
    const d=new T3.DirectionalLight(0xffffff,.62);d.position.set(1.2,2.2,2.4);sc.add(d);
    const d2=new T3.DirectionalLight(0xffe2c4,.22);d2.position.set(-2,1,-1);sc.add(d2);
    G3={r,c,sc,urls:{},geo:{},mat:{}};
    return true;
  }catch(e){G3=null;return false}
}
function geo(key,make){return G3.geo[key]||(G3.geo[key]=make())}
function M3(hex,rough,metal,extra){
  const k=hex+'|'+rough+'|'+metal+'|'+(extra||'');
  if(G3.mat[k])return G3.mat[k];
  const o={color:hex,roughness:rough===undefined?.62:rough,metalness:metal||0};
  if(extra==='ds')o.side=T3.DoubleSide;
  if(extra==='tr'){o.transparent=true;o.opacity=.5}
  return G3.mat[k]=new T3.MeshStandardMaterial(o);
}
function mk(g,mt,x,y,z,sx,sy,sz){
  const m=new T3.Mesh(g,mt);m.position.set(x||0,y||0,z||0);
  if(sx!==undefined)m.scale.set(sx,sy===undefined?sx:sy,sz===undefined?sx:sz);
  m.castShadow=true;return m;
}
const gSph=()=>geo('sph',()=>new T3.SphereGeometry(1,28,20));
const gBox=()=>geo('box',()=>new T3.BoxGeometry(1,1,1));
const gCap=(r,l)=>geo('cap'+r+'_'+l,()=>new T3.CapsuleGeometry(r,l,6,16));
const gDome=(r,th)=>geo('dome'+r+'_'+th,()=>new T3.SphereGeometry(r,28,14,0,Math.PI*2,0,Math.PI*th));
const gTor=(R,r,arc)=>geo('tor'+R+'_'+r+'_'+arc,()=>new T3.TorusGeometry(R,r,8,24,arc));
const gCyl=(r,h)=>geo('cyl'+r+'_'+h,()=>new T3.CylinderGeometry(r,r,h,24));

/* ---------- 3D characters ---------- */
function buildChar(o,mood){
  mood=mood||'neutral';
  const root=new T3.Group(),K='#1c1420';

  const skin=M3(skinHex,.55,0),top=M3(o.top,.7,0),pants=M3(o.pants||'#1F2A44',.75,0),shoe=M3(o.shoe||'#FFFFFF',.45,0),sole=M3('#F4F1EA',.5,0);
  // legs

  for(const sx of [-1,1]){
    const leg=new T3.Group();leg.position.set(sx*.145,.56,0);

    leg.add(mk(gSph(),sole,0,-.52,.075,.155,.04,.245));

  }
  // body
  const body=new T3.Group();body.position.y=.86;root.add(body);
  const torso=mk(gCap(.27,o.coat?.44:.3),top,0,o.coat?-.06:0,0);torso.scale.set(1,1,.84);body.add(torso);
  if(o.coat){body.add(mk(gBox(),M3('#2E5BFF',.5,0),.13,.05,.235,.09,.03,.02));body.add(mk(gBox(),M3('#d8d8de',.6,0),0,-.05,.232,.012,.5,.01))}
  else if(!o.hood){const t=mk(gTor(.075,.02,Math.PI),M3(lum(o.top)>.6?'#1c1420':'#F4F1EA',.6,0),0,-.02,.235);body.add(t)}
  else{body.add(mk(gCap(.012,.16),M3('#F4F1EA',.6,0),-.07,.08,.24));body.add(mk(gCap(.012,.16),M3('#F4F1EA',.6,0),.07,.08,.24))}
  if(o.acc==='chain'){const ch=mk(gTor(.2,.02,Math.PI*2),M3('#E8B93C',.3,.7),0,.2,.07);ch.rotation.x=Math.PI/2-.75;body.add(ch);body.add(mk(gSph(),M3('#E8B93C',.3,.7),0,.07,.27,.05))}
  // arms
  const arms=[];
  for(const sx of [-1,1]){
    const arm=new T3.Group();arm.position.set(sx*.33,1.04,0);arm.rotation.z=sx*.2;
    arm.add(mk(gCap(.085,.24),top,0,-.19,0));
    arm.add(mk(gSph(),skin,0,-.42,0,.1));
    root.add(arm);arms.push(arm);
  }
  // head
  const head=new T3.Group();head.position.y=1.56;root.add(head);
  if(o.hood){const hd=mk(geo('hood',()=>new T3.SphereGeometry(.6,28,18,Math.PI/2+.95,Math.PI*2-1.9)),M3(o.top,.75,0,'ds'),0,.02,-.04);head.add(hd)}
  head.add(mk(gSph(),skin,0,0,0,.5,.47,.48));
  head.add(mk(gSph(),skin,-.49,-.03,0,.09,.1,.07));head.add(mk(gSph(),skin,.49,-.03,0,.09,.1,.07));
  const hairM=M3(o.hairC||'#151413',.8,0);
  if(!o.hood){
    const dome=(r,th,tilt)=>{const d=mk(gDome(r,th),hairM,0,0,0);d.scale.set(1,.95,.98);d.rotation.x=tilt;return d};
    const h=o.hair;
    if(h==='buzz')head.add(dome(.508,.46,-.42));
    else head.add(dome(.53,.5,-.36));
    if(h==='afro')head.add(mk(gSph(),hairM,0,.2,-.2,.69,.62,.56));
    if(h==='buns'){head.add(mk(gSph(),hairM,-.31,.46,-.05,.18));head.add(mk(gSph(),hairM,.31,.46,-.05,.18))}
    if(h==='long')head.add(mk(gSph(),hairM,0,-.22,-.24,.57,.74,.4));
    if(h==='braids'){head.add(mk(gCap(.07,.5),hairM,-.47,-.36,-.06));head.add(mk(gCap(.07,.5),hairM,.47,-.36,-.06))}
  }
  // face
  const face=new T3.Group();head.add(face);
  const dark=M3(K,.4,0),white=M3('#FFFFFF',.4,0),mouthM=M3('#6E2622',.6,0);
  const ex=.175,ey=.03,ez=.452;
  if(o.shades){
    const v=mk(gCap(.085,.4),M3('#15131f',.2,.3),0,.035,.44);v.rotation.z=Math.PI/2;v.scale.set(1,1,.5);face.add(v);
    face.add(mk(gSph(),white,-.14,.07,.485,.035,.014,.01));
  }else if(mood==='happy'){
    for(const sx of [-1,1]){const a=mk(gTor(.062,.02,Math.PI),dark,sx*ex,ey-.01,ez);face.add(a)}
  }else if(mood==='shocked'){
    for(const sx of [-1,1]){face.add(mk(gSph(),white,sx*ex,ey,ez-.01,.095,.105,.04));face.add(mk(gSph(),dark,sx*ex,ey,ez+.025,.04,.045,.02))}
  }else if(mood==='smug'){
    for(const sx of [-1,1]){face.add(mk(gSph(),dark,sx*ex,ey,ez,.062,.034,.03))}
  }else{
    for(const sx of [-1,1]){face.add(mk(gSph(),dark,sx*ex,ey,ez,.056,.072,.03));face.add(mk(gSph(),white,sx*ex+.02,ey+.028,ez+.028,.017))}
  }
  const browM=M3(mix(o.hairC||'#151413','#1c1420',.5),.7,0);
  if(mood==='shocked'){for(const sx of [-1,1]){const b=mk(gBox(),browM,sx*ex,ey+.17,ez-.02,.12,.026,.02);b.rotation.z=sx*-.25;face.add(b)}}
  else if(mood==='smug'){const b1=mk(gBox(),browM,-ex,ey+.1,ez-.005,.12,.026,.02);face.add(b1);const b2=mk(gBox(),browM,ex,ey+.15,ez-.01,.12,.026,.02);b2.rotation.z=.3;face.add(b2)}
  else if(mood==='neutral'&&!o.shades){for(const sx of [-1,1]){const b=mk(gBox(),browM,sx*ex,ey+.125,ez-.008,.11,.022,.02);b.rotation.z=sx*-.08;face.add(b)}}
  const mz=o.beard?.5:.455;
  if(mood==='happy'){const m=mk(geo('smile',()=>new T3.CircleGeometry(.105,20,Math.PI,Math.PI)),mouthM,0,-.13,mz);m.rotation.x=.3;face.add(m);
    for(const sx of [-1,1]){face.add(mk(gSph(),M3('#F0707A',.7,0,'tr'),sx*.3,-.1,.365,.075,.05,.03))}}
  else if(mood==='shocked'){face.add(mk(gSph(),mouthM,0,-.19,mz-.005,.06,.075,.03))}
  else if(mood==='smug'){const m=mk(gTor(.07,.017,Math.PI*.75),dark,.03,-.14,mz);m.rotation.z=Math.PI*1.12;m.rotation.x=.3;face.add(m)}
  else{face.add(mk(gSph(),dark,0,-.17,mz,.07,.017,.02))}
  if(o.beard){const b=mk(geo('beard',()=>new T3.SphereGeometry(.515,24,14,0,Math.PI*2,Math.PI*.56,Math.PI*.44)),M3(o.beard,.85,0),0,-.005,.015);b.scale.set(1,.95,1);head.add(b)}
  if((o.glasses||o.acc==='glasses')&&!o.shades){

    for(const sx of [-1,1])face.add(mk(gTor(.095,.016,Math.PI*2),gm,sx*ex,ey,ez+.03));

    const b=mk(gTor(.52,.07,Math.PI*2),cc,0,.07,-.02);b.rotation.x=Math.PI/2-.2;head.add(b);
    head.add(mk(gSph(),cc,0,.6,-.1,.11));
  }
  if(o.acc==='flatcap'){head.add(mk(gSph(),cc,0,.36,.02,.56,.2,.6));head.add(mk(gSph(),cc,0,.27,.5,.3,.035,.2))}
  if(o.acc==='headphones'||o.acc==='headset'){
    const hc=M3(o.acc==='headset'?'#15131f':'#FF6A1A',.4,.1);
    head.add(mk(gTor(.53,.035,Math.PI),M3('#15131f',.4,.2),0,0,0));
    for(const sx of [-1,1]){const c=mk(gCyl(.13,.1),hc,sx*.54,-.03,0);c.rotation.z=Math.PI/2;head.add(c)}
    if(o.acc==='headset'){const mic=mk(gCap(.014,.3),M3('#15131f',.4,.2),-.4,-.2,.25);mic.rotation.set(1.1,0,.5);head.add(mic);head.add(mk(gSph(),M3('#15131f',.4,.2),-.27,-.24,.4,.04))}
  }

  return root;
}
function animChar(ch,t){
  const u=ch.userData,st=(u.until&&t>u.until)?(u.state=u.base||'idle',u.until=0,u.state):u.state;
  const L=u.legs,A=u.arms;
  ch.position.y=u.y0||0;ch.rotation.z=0;
  if(st==='walk'){
    const s=Math.sin(t*11+u.ph);
    L[0].rotation.x=s*.7;L[1].rotation.x=-s*.7;A[0].rotation.x=-s*.6;A[1].rotation.x=s*.6;A[0].rotation.z=-.2;A[1].rotation.z=.2;
    ch.position.y+=Math.abs(Math.cos(t*11+u.ph))*.05;u.head.rotation.z=0;
  }else if(st==='happy'){
    const j=Math.abs(Math.sin(t*8));ch.position.y+=j*.2;
    A[0].rotation.z=-2.5-j*.2;A[1].rotation.z=2.5+j*.2;A[0].rotation.x=A[1].rotation.x=0;L[0].rotation.x=L[1].rotation.x=0;u.head.rotation.z=Math.sin(t*8)*.06;
  }else if(st==='shock'){
    ch.rotation.z=Math.sin(t*42)*.04;A[0].rotation.z=-1.3;A[1].rotation.z=1.3;A[0].rotation.x=A[1].rotation.x=0;L[0].rotation.x=L[1].rotation.x=0;
  }else{
    const s=Math.sin(t*2.1+u.ph);
    u.body.scale.y=1+s*.015;u.head.position.y=1.56+s*.012;u.head.rotation.z=Math.sin(t*1.2+u.ph)*.035;
    A[0].rotation.z=-.2-s*.03;A[1].rotation.z=.2+s*.03;A[0].rotation.x=A[1].rotation.x=s*.05;L[0].rotation.x=L[1].rotation.x=0;
  }
}

function shapeFrom(d){
  const sh=new T3.Shape(),tk=d.match(/[MLQZ]|-?\d*\.?\d+/g);let i=0,cmd='';
  while(i<tk.length){

/* ---------- mini-game: clean ---------- */
function cleanGame(p){
  const m=MBY[p.m];
  openModal(`<div class="sechead"><h3>Fresh kicks</h3><span class="lbl">${COND[p.cond].n}</span></div><p class="hint" style="margin:0">Scrub the dirt off with your finger. 97% clean or better can reach Deadstock.</p>
  <div class="cleanbox" id="cbox">${shoeSVG(m,modsFor(p))}<canvas id="dirt"></canvas></div>
  <div class="timer"><i id="ctime" style="width:100%"></i></div>
  <div class="sechead"><span class="lbl">Clean <b class="num" id="cpct">0%</b></span><button class="btn small" id="cdone">Done</button></div>`,sh=>{
    const cv=sh.querySelector('#dirt'),box=sh.querySelector('#cbox');
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const sx=W/224,sy=H/106;
    const cols=['rgba(92,66,40,.94)','rgba(120,90,55,.92)','rgba(70,52,34,.94)','rgba(140,112,70,.9)'];
    for(let i=0;i<110;i++){ctx.fillStyle=pick(cols);ctx.beginPath();const x=(14+Math.random()*196)*sx,y=(14+Math.random()*86)*sy;ctx.ellipse(x,y,(8+Math.random()*18)*sx,(6+Math.random()*12)*sy,Math.random()*3,0,6.283);ctx.fill()}
    for(let i=0;i<160;i++){ctx.fillStyle=pick(cols);ctx.beginPath();ctx.arc((10+Math.random()*204)*sx,(12+Math.random()*90)*sy,1+Math.random()*2.5,0,6.283);ctx.fill()}
    const count=()=>{const d=ctx.getImageData(0,0,cv.width,cv.height).data;let c=0;const step=6*dpr|0;for(let y=0;y<cv.height;y+=step)for(let x=0;x<cv.width;x+=step){if(d[(y*cv.width+x)*4+3]>40)c++}return c};
    const base=count()||1;let pct=0,down=false,lx=0,ly=0,finished=false;
    ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=30;
    const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    cv.addEventListener('pointerdown',e=>{down=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(lx,ly,15,0,6.283);ctx.fill()});
    cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y});
    const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    const T=9,start=now();
    const iv=setInterval(()=>{pct=1-count()/base;const pe=sh.querySelector('#cpct');if(pe)pe.textContent=Math.floor(pct*100)+'%';const left=T-(now()-start);const te=sh.querySelector('#ctime');if(te)te.style.width=clamp(left/T,0,1)*100+'%';if(left<=0||pct>=.985)finish()},150);
    function finish(){
      if(finished)return;finished=true;clearInterval(iv);pct=1-count()/base;
      const before=p.cond;let gain=pct>=.97?2:pct>=.7?1:0;
      let nc=p.cond+gain;nc=pct>=.97?Math.min(nc,4):Math.min(nc,3);nc=Math.max(nc,p.cond);
      p.cond=nc;p.cleaned=true;if(pct>=.9)quest('clean');if(nc===4)confetti(90);
      sh.innerHTML=`<h3>${nc>before?'Fresh!':'Still grubby'}</h3><div class="bigstat">${Math.floor(pct*100)}%</div><p style="margin:0;text-align:center">${COND[before].n} → <b>${COND[nc].n}</b>. Worth <b class="num">${fmt(value(p))}</b> now.</p><button class="btn primary" data-close>Back to shelf</button>`;
    }
    sh.querySelector('#cdone').addEventListener('click',finish);
    return()=>clearInterval(iv);
  });
}

/* ---------- mini-game: spot the fake ---------- */
function legitGame(p){
  const m=MBY[p.m],mods=modsFor(p);const found=[];let penalty=0,over=false;
  const T=13,start=now();
  const draw=sh=>{sh.querySelector('#sus').innerHTML=shoeSVG(m,mods,{hit:true,marks:found})};
  openModal(`<div class="sechead"><h3>Spot the fake</h3><span class="lbl">${esc(m.code)}</span></div>
  <p class="hint" style="margin:0">Compare this pair with the retail photo. Tap every detail that's different. If it all matches, tap <b>Looks legit</b>.</p>
  <div class="cmp"><figure><figcaption>Retail photo</figcaption>${shoeSVG(m)}</figure><figure class="suspect" id="susf"><figcaption>This pair · tap differences</figcaption><div id="sus"></div></figure></div>
  <div class="timer"><i id="ltime" style="width:100%"></i></div>
  <div class="row"><button class="btn primary" id="legit">Looks legit</button></div>`,sh=>{
    draw(sh);
    sh.querySelector('#sus').addEventListener('click',e=>{
      if(over)return;const h=e.target.closest('.hit');if(!h)return;const k=h.dataset.slot;
      if(p.diffs.includes(k)){if(!found.includes(k)){found.push(k);draw(sh);if(found.length===p.diffs.length)end('caught')}}
      else{penalty+=2.5;const f=sh.querySelector('#susf');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
    });
    sh.querySelector('#legit').addEventListener('click',()=>end('legit'));
    const iv=setInterval(()=>{const left=T-(now()-start)-penalty;const te=sh.querySelector('#ltime');if(te)te.style.width=clamp(left/T,0,1)*100+'%';if(left<=0)end('time')},100);
    function end(r){
      if(over)return;over=true;clearInterval(iv);let html;if(r!=='time')quest('legit');
      if(r==='caught'){S.pairs=S.pairs.filter(x=>x!==p);S.cash+=p.paid;S.clout+=3;maybeStory('firstFake');html=`<h3>Fake caught</h3><p style="margin:0">You found ${found.length===1?'the flaw':'all '+found.length+' flaws'}. The seller refunded <b class="num">${fmt(p.paid)}</b> and you gained 3 Clout.</p>`}
      else if(r==='legit'){p.ver=true;html=`<h3>Marked legit</h3><p style="margin:0">Verified pairs sell for 25% more. Hope you're right: selling a fake costs you a refund and 8 Clout.</p>`}
      else html=`<h3>Time's up</h3><p style="margin:0">No verdict. You can try again from your shelf.</p>`;
      sh.innerHTML=html+`<button class="btn primary" data-close>Back to shelf</button>`;
    }
    return()=>clearInterval(iv);
  });
}

function dropGame(){

  S.tickets--;if(S.tickets<ticketCap()&&now()-S.ticketT>DROPLEN)S.ticketT=now();S.claimed=slot;quest('drop');
  const m=dropModel(slot);let retried=false;
  const run=sh=>{
    let taps=0,phase='count',n=3,iv;const kiki=18+Math.floor(Math.random()*45);
    sh.innerHTML=`<div class="sechead"><h3>Line-up rush</h3>${rarChip(m.rar)}</div><p class="hint" style="margin:0">${esc(m.name)}. Tap to push up the line. Six seconds.</p>

    let start;
    iv=setInterval(()=>{
      if(phase==='count'){n-=.1;btn.textContent='Get ready · '+Math.max(1,Math.ceil(n));if(n<=0){phase='go';start=now();btn.disabled=false;btn.textContent='TAP TAP TAP'}}

      const beat=ps<kiki;if(beat)S.clout+=2;

      const canRetry=ps>125&&!retried;
      sh.innerHTML=html+(canRetry?`<div class="row"><button class="btn" id="retry">Retry · watch ad</button><button class="btn primary" data-close>Done</button></div>`:`<button class="btn primary" data-close>Done</button>`);

    }
    modalCleanup=()=>clearInterval(iv);
  };
  const go=()=>openModal('',sh=>{run(sh);return modalCleanup});
  if(!S.story.firstDrop)story('firstDrop',go);else go();
}

/* ---------- juice: confetti, coins, bursts ---------- */
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n,colors){
  if(RM)return;
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  colors=colors||['#FF5B14','#2E5BFF','#128A55','#E0B43A','#E23A7A','#7A3CF0','#F8F6F2'];
  const ps=[];for(let i=0;i<(n||140);i++)ps.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-6-Math.random()*12,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:5+Math.random()*6,h:8+Math.random()*8,c:pick(colors)});
  const t0=performance.now();
  (function f(t){const el=(t-t0)/1000;ctx.clearRect(0,0,W,H);
    for(const p of ps){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));ctx.restore()}
    if(el<2.6)requestAnimationFrame(f);else cv.remove()})(t0);
}
let lastPt=null;
document.addEventListener('pointerdown',e=>{lastPt={x:e.clientX,y:e.clientY,t:performance.now()}},true);
function fromPt(){if(lastPt&&performance.now()-lastPt.t<1500)return lastPt;const r=$('#scene').getBoundingClientRect();return{x:r.left+r.width*.7,y:r.top+r.height*.5}}
function flyCash(n,from){
  const cash=$('#cash');
  if(RM){bumpCash();return}
  const to=cash.getBoundingClientRect(),f=from||fromPt();
  const tx=to.left+30,ty=to.top+to.height/2;
  for(let i=0;i<n;i++){
    const c=document.createElement('span');c.className='coin';c.textContent='$';document.body.appendChild(c);
    const sx=f.x+(Math.random()-.5)*30,sy=f.y+(Math.random()-.5)*20,mx=(sx+tx)/2+(Math.random()-.5)*120,my=Math.min(sy,ty)-40-Math.random()*60;
    const a=c.animate([{transform:`translate(${sx}px,${sy}px) scale(.6)`,opacity:0},{transform:`translate(${sx}px,${sy-20}px) scale(1.1)`,opacity:1,offset:.15},{transform:`translate(${mx}px,${my}px) scale(1)`,opacity:1,offset:.55},{transform:`translate(${tx}px,${ty}px) scale(.5)`,opacity:.9}],{duration:700+i*45,easing:'cubic-bezier(.4,0,.6,1)'});
    a.onfinish=()=>{c.remove();if(i===n-1)bumpCash()};
  }
}
function bumpCash(){const c=$('#cash');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
function burst(x,y,color,n){
  if(RM)return;
  for(let i=0;i<(n||7);i++){const d=document.createElement('span');d.className='spk';d.style.background=color||'var(--box)';document.body.appendChild(d);
    const ang=Math.random()*6.283,dist=30+Math.random()*40;
    const a=d.animate([{transform:`translate(${x}px,${y}px) scale(1)`,opacity:1},{transform:`translate(${x+Math.cos(ang)*dist}px,${y+Math.sin(ang)*dist}px) scale(.2)`,opacity:0}],{duration:450+Math.random()*250,easing:'cubic-bezier(.2,.8,.3,1)'});
    a.onfinish=()=>d.remove()}
}

/* ---------- daily streak ---------- */
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function yKey(){return dayKey(new Date(Date.now()-864e5))}
const STREAK=[{t:'cash',v:100,l:'Cash'},{t:'tix',v:1,l:'Ticket'},{t:'cash',v:400,l:'Cash'},{t:'tix',v:2,l:'2 Tix'},{t:'pair',v:2,l:'Heat pair'},{t:'cash',v:1500,l:'Big cash'},{t:'pair',v:3,l:'Hype pair'}];
function streakNext(){const sk=S.sk||{};return sk.last===yKey()?(sk.n%7)+1:1}
function streakDue(){return !S.sk||S.sk.last!==dayKey()}
function streakRow(){
  const due=streakDue(),nx=due?streakNext():(S.sk?S.sk.n:0);
  return `<div class="streak">${STREAK.map((r,i)=>{const d=i+1,done=due?d<nx:d<=nx,today=due&&d===nx;return `<div class="sday ${done?'done':''} ${today?'today':''}"><span class="lbl">Day ${d}</span><b>${r.t==='cash'?fmt(r.v*STAGES[S.stage].mult):r.l}</b></div>`}).join('')}</div>`;
}
function claimStreak(){
  if(!streakDue())return;const d=streakNext(),r=STREAK[d-1],mult=STAGES[S.stage].mult;
  S.sk={last:dayKey(),n:d};
  if(r.t==='cash'){earn(r.v*mult);flyCash(10);toast(`Day ${d} streak: +${fmt(r.v*mult)}`,'good')}
  if(r.t==='tix'){S.tickets+=r.v;toast(`Day ${d} streak: +${r.v} drop tickets`,'good')}
  if(r.t==='pair'){const pool=MODELS.filter(x=>x.stage===S.stage&&x.rar===Math.max(...MODELS.filter(y=>y.stage===S.stage&&y.rar<=r.v).map(y=>y.rar)));const m=pick(pool);const p=makePair(m,3,false,0);S.pairs.push(p);return m}
  return null;
}
function streakModal(){
  if(!streakDue())return;
  const d=streakNext();
  openModal(`<div class="lbl">Daily streak</div><h3>Day ${d} reward</h3><p class="hint" style="margin:0">Come back every day. Miss a day and the streak starts over. Day 7 is a guaranteed Hype pair.</p>${streakRow()}<button class="btn primary" id="skc">Claim day ${d}</button>`,sh=>{
    sh.querySelector('#skc').addEventListener('click',()=>{const m=claimStreak();closeModal();if(m)reveal(m,3)});
  });
}

const QDEF={
  sell:{t:n=>`Flip ${n} pairs`,n:[5,8,12]},bin:{t:n=>`Pull ${n} pairs from your source`,n:[4,6,10]},
  clean:{t:n=>`Score 90%+ on ${n} cleans`,n:[2,3]},legit:{t:n=>`Legit-check ${n} pairs`,n:[2,4]},
  cust:{t:n=>`Sell to ${n} walk-in customers`,n:[2,3,5]},drop:{t:n=>`Enter ${n} drop${n>1?'s':''}`,n:[1,2]},
  tap:{t:n=>`Tap Hustle ${n} times`,n:[100,200,300]},order:{t:n=>`Deliver ${n} order${n>1?'s':''}`,n:[1,2,3]},lab:{t:n=>`Restore ${n} pair${n>1?'s':''} in the lab`,n:[1,2]},flip2x:{t:n=>`Sell ${n} pair${n>1?'s':''} for 2× what you paid`,n:[1,2]}};
function ensureQuests(){
  const d=dayKey();if(S.q&&S.q.day===d)return;
  const keys=Object.keys(QDEF).sort((a,b)=>srand(hash(d+a))-srand(hash(d+b))).slice(0,3);
  S.q={day:d,bonus:false,list:keys.map(k=>{const ns=QDEF[k].n;return{k,n:ns[Math.floor(srand(hash(d+k+'n'))*ns.length)],p:0,c:false}})};
}
function quest(k,a){ensureQuests();let changed=false;for(const q of S.q.list){if(q.k===k&&q.p<q.n){q.p=Math.min(q.n,q.p+(a||1));changed=true;if(q.p===q.n)toast('Goal complete: '+QDEF[q.k].t(q.n)+'. Claim it in Goals.','good')}}if(changed)goalsPill()}
function questReward(){return Math.max(150*STAGES[S.stage].mult,baseIps()*240)}

  if(!S.q)return;const done=S.q.list.filter(q=>q.c).length,ready=S.q.list.some(q=>q.p>=q.n&&!q.c)||streakDue()||(done===3&&!S.q.bonus);

  for(const x of SETS){if(!S.sets[x.id]&&x.ms.every(id=>S.seen[id])){S.sets[x.id]=1;queueModal(()=>setModal(x))}}
}
const SIL={u:'#D6D0C6',u2:'#C9C2B6',s:'#E2DDD4',o:'#BDB6AA',l:'#E2DDD4',g:'#BDB6AA',h:'#C9C2B6',t:'#BDB6AA',st:'#BDB6AA',sil:1};
function setModal(x){
  confetti(160);
  openModal(`<div class="lbl">Set complete</div><h3>${esc(x.n)}</h3><div class="setthumbs big">${x.ms.map(id=>`<div>${shoePic(MBY[id],{},{big:true})}</div>`).join('')}</div><p style="margin:0">Permanent bonus: <b>+${Math.round(x.b*100)}% all income</b>. A trophy for this set now hangs in your shop.</p><button class="btn primary" data-close>Hang it up</button>`);
  maybeStory('firstSet');
}
function vSets(){
  const done=SETS.filter(x=>S.sets&&S.sets[x.id]).length;
  let h=`<section><div class="sechead"><h2>Sneaker book</h2><span class="lbl">${done}/${SETS.length} sets · +${Math.round(setBonus()*100)}% income</span></div><p class="hint" style="margin:4px 0 8px">Own every pair in a set once, even if you sell it later, to lock in a permanent bonus.</p><div class="sets">`;
  for(const x of SETS){
    const have=x.ms.filter(id=>S.seen[id]).length,comp=S.sets&&S.sets[x.id],locked=x.st>S.stage&&!have;
    h+=`<div class="setcard ${comp?'done':''} ${locked?'locked':''}"><div class="sethead"><b>${esc(x.n)}</b><span class="num">${comp?'DONE':have+'/'+x.ms.length}</span></div>
    <div class="setthumbs">${x.ms.map(id=>`<div title="${esc(S.seen[id]?MBY[id].name:'Not found yet')}">${shoePic(MBY[id],S.seen[id]?{}:SIL)}</div>`).join('')}</div>
    <div class="setfoot"><span>+${Math.round(x.b*100)}% income</span><span>${locked?esc(STAGES[x.st].name):''}</span></div></div>`;
  }
  return h+`</div></section>`;
}
function trophiesSVG(){
  let s='';const done=SETS.filter(x=>S.sets&&S.sets[x.id]);
  done.forEach((x,i)=>{const col=i%6,row=Math.floor(i/6),X=178+col*27,Y=row?24:46;
    s+=`<g transform="translate(${X},${Y})"><rect width="24" height="17" rx="1.5" fill="#F8F6F2" stroke="#151413" stroke-width="1.6"/><rect x="2" y="2" width="20" height="13" fill="${x.b>=.3?'#FFD66B':'#FFE7D6'}"/><g transform="translate(3.5,4.5) scale(.077)">${shoeSVG(MBY[x.ms[x.ms.length-1]],{},{inner:true})}</g></g>`});
  return s;
}

/* ---------- order board ---------- */
const ONAMES=['Jaylen','Priya','Marcus','Sofia','Dre','Mina','Tyler','Aaliyah','Kenji','Zoe','Omar','Lena','Rico','Hana'];
const ORDER_T=[240,480];
function genOrder(){
  const pool=MODELS.filter(m=>m.stage===S.stage);
  const r=Math.random();let o;
  const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))*10)/10;
  if(r<.4){const br=pick([...new Set(pool.map(m=>m.br))]);const q=S.stage===0?1:(Math.random()<.5?1:2);o={type:'brand',br,q,mult:rnd(1.6,2.1),label:`${q} × any ${BRANDS[br].n}`,line:pick([`Need ${BRANDS[br].n} for the weekend.`,`My whole squad wants ${BRANDS[br].n}.`,`Any ${BRANDS[br].n}, any size. Hurry.`])}}
  else if(r<.62){const mr=S.stage===0?2:3;o={type:'rar',mr,q:1,mult:rnd(1.8,2.3),label:`1 × ${RAR[mr].n} or rarer`,line:pick(['Something with heat. Surprise me.','I need a flex for tonight.','Got anything rare?'])}}
  else if(r<.78){o={type:'cond',q:1,mult:rnd(1.7,2.1),label:'1 × any pair in Mint or better',line:pick(['Has to look brand new.','Clean pairs only, please.','Wedding shoes. Must be spotless.'])}}
  else{const opts=pool.filter(m=>m.rar<=3);const m=pick(opts);o={type:'model',id:m.id,q:1,mult:rnd(2.6,3.3),label:`1 × ${m.name}`,line:pick(['Been hunting these for months.','This exact pair. Name your price.','My grail. Please!'])}}
  o.id2=S.uid++;o.who=pick(ONAMES);o.look=randLook();o.exp=now()+ORDER_T[0]+Math.random()*(ORDER_T[1]-ORDER_T[0]);o.dur=o.exp-now();
  return o;
}
function orderFits(o,p){
  const m=MBY[p.m];
  if(o.type==='brand')return m.br===o.br;
  if(o.type==='rar')return m.rar>=o.mr;
  if(o.type==='cond')return p.cond>=3;
  if(o.type==='model')return m.id===o.id;
  return false;
}
function orderPairs(o){const t=now();return S.pairs.filter(p=>orderFits(o,p)).sort((a,b)=>value(a,t)-value(b,t)).slice(0,o.q)}
function orderTick(){
  if(tutOn())return;
  if(!S.orders)S.orders=[];const t=now();
  const before=S.orders.length;
  S.orders=S.orders.filter(o=>{if(t>o.exp){toast(`${o.who}'s order expired.`);return false}return true});
  if(S.orders.length<3&&t>=(S.orderNext||0)){S.orders.push(genOrder());S.orderNext=t+35+Math.random()*25}
  if(S.orders.length!==before&&tab==='stash'&&!modalOpen)render();
}
function deliver(id){
  const o=S.orders.find(x=>x.id2==id);if(!o)return;const ps=orderPairs(o);if(ps.length<o.q)return;
  const t=now();let pay=ps.reduce((a,p)=>a+value(p,t),0)*o.mult*passMult();
  const fake=ps.some(p=>p.fake);
  S.pairs=S.pairs.filter(p=>!ps.includes(p));S.orders=S.orders.filter(x=>x!==o);
  earn(pay);S.clout+=2*o.q;S.sold+=o.q;S.ordersDone=(S.ordersDone||0)+1;quest('order');ps.forEach(()=>quest('sell'));
  flyCash(14);setPlayerMood('happy',1500);sayPlayer(pick(['Order up!','Delivered!','Pleasure!']));
  toast(`Delivered to ${o.who}: +${fmt(pay)} (${o.mult}× market)`,'good');
  if(fake)setTimeout(()=>{S.cash-=pay;S.clout=Math.max(0,S.clout-10);toast(`${o.who} found a fake in the order. You refunded ${fmt(pay)} and lost 10 Clout.`,'bad');setPlayerMood('shocked',2000);maybeStory('firstFake');hud()},1600);
  render();
}
function vOrders(){
  if(!S.orders)S.orders=[];const t=now();
  let h=`<section class="orders"><div class="sechead"><h2>Order board</h2><span class="lbl">${S.ordersDone||0} delivered</span></div><div class="olist">`;
  if(!S.orders.length)h+=`<div class="empty">No orders yet. Regulars post new ones every minute or so.</div>`;
  for(const o of S.orders){
    const ps=orderPairs(o),ok=ps.length>=o.q,left=Math.max(0,o.exp-t);
    const est=ok?ps.reduce((a,p)=>a+value(p,t),0)*o.mult*passMult():0;
    h+=`<div class="order ${ok?'ready':''}"><div class="oface">${facePic(o.look,ok?'happy':'neutral',{label:o.who})}</div>
    <div class="obody"><div class="owho"><b>${esc(o.who)}</b><span class="omult num">${o.mult}× market</span></div><div class="oreq">${esc(o.label)}</div><div class="oline">"${esc(o.line)}"</div>
    <div class="otime"><div class="bar"><i data-obar="${o.id2}" style="width:${left/o.dur*100}%"></i></div><span class="num" data-oexp="${o.id2}">${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}</span></div></div>
    <button class="btn small ${ok?'primary':''}" data-act="order" data-id="${o.id2}" ${ok?'':'disabled'}>${ok?'Deliver<span class="num">'+fmt(est)+'</span>':'Have '+ps.length+'/'+o.q}</button></div>`;
  }
  return h+`</div></section>`;
}

/* ---------- restoration lab ---------- */
const LAB_T=180,LAB_SLOT_COST=[0,5000,250000];
function labSlots(){return S.labSlots||1}
function labCost(p){return Math.max(5,Math.round(value(p)*.15))}
function labModal(p){
  const m=MBY[p.m];const c=labCost(p);
  if(!S.lab)S.lab=[];
  if(S.lab.length>=labSlots()){toast('Every lab bench is busy. Unlock another bench in the lab.','bad');return}
  const after=m.base*COND[4].m*(p.ver?1.25:1)*hype(m,now());
  openModal(`<div class="lbl">Restoration lab</div><h3>Restore to Deadstock</h3><div class="labprev">${shoePic(m,modsFor(p),{big:true})}</div>
  <p style="margin:0"><b>${esc(m.name)}</b> goes from ${COND[p.cond].n} to <b>Deadstock</b>. At today's hype it would be worth about <b class="num">${fmt(after)}</b>.</p>
  <p class="hint" style="margin:0">Takes ${Math.round(LAB_T/60)} minutes in this prototype (4 hours in the full game). The pair leaves your shelf while it's away.</p>
  <div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="labgo" ${S.cash<c?'disabled':''}>Send · <span class="num">${fmt(c)}</span></button></div>`,sh=>{
    sh.querySelector('#labgo').addEventListener('click',()=>{if(S.cash<c)return;S.cash-=c;S.pairs=S.pairs.filter(x=>x!==p);S.lab.push({p,done:now()+LAB_T,dur:LAB_T,told:false});closeModal();toast(m.name+' is on the bench.');maybeStory('lab')});
  });
}
function labTick(){
  if(!S.lab)return;const t=now();
  for(const L of S.lab){if(!L.told&&t>=L.done){L.told=true;toast('Restoration done: '+MBY[L.p.m].name+' is Deadstock. Pick it up in the lab.','good');if(tab==='stash'&&!modalOpen)render()}}
}
function pickup(i){
  const L=S.lab[i];if(!L||now()<L.done)return;
  if(!shelfFree()){toast('Shelf is full. Sell a pair first.','bad');return}
  L.p.cond=4;L.p.cleaned=true;S.pairs.push(L.p);S.lab.splice(i,1);quest('lab');
  setPlayerMood('happy',1500);sayPlayer('Fresh out the lab!');
  const r=$('#scene').getBoundingClientRect();burst(r.left+r.width*.7,r.top+r.height*.5,'#FFD66B',14);
  render();
}
function vLab(){
  if(!S.lab)S.lab=[];const t=now(),n=labSlots();
  let h=`<section class="lab"><div class="sechead"><h2>Restoration lab</h2><span class="lbl">${n} bench${n>1?'es':''}</span></div><div class="benches">`;
  for(let i=0;i<3;i++){
    const L=S.lab[i];
    if(i>=n){if(i===n)h+=`<div class="bench lockedb"><div><b>Bench ${i+1}</b><span class="hint">Restore more pairs at once</span></div><button class="btn small" data-act="labslot" ${S.cash<LAB_SLOT_COST[i]?'disabled':''}>Unlock <span class="num">${fmt(LAB_SLOT_COST[i])}</span></button></div>`;continue}
    if(!L){h+=`<div class="bench emptyb"><span>Empty bench. Tap <b>Restore</b> on any pair to bring it back to Deadstock.</span></div>`;continue}
    const m=MBY[L.p.m],left=Math.max(0,L.done-t),ready=left<=0;
    h+=`<div class="bench ${ready?'readyb':''}"><div class="bthumb">${shoePic(m,modsFor(L.p))}</div><div class="bbody"><b>${esc(m.name)}</b>
    <div class="otime"><div class="bar"><i data-lbar="${i}" style="width:${(1-left/L.dur)*100}%"></i></div><span class="num" data-lab="${i}">${ready?'Done':Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0')}</span></div></div>
    ${ready?`<button class="btn small primary" data-act="pickup" data-i="${i}">Pick up</button>`:`<button class="btn small" data-act="rush" data-i="${i}">Finish · ad</button>`}</div>`;
  }
  return h+`</div></section>`;
}

/* ---------- loop ---------- */
let lastT=now(),acc1=0,acc3=0;
function loop(){
  const t=now(),dt=Math.min(t-lastT,5);lastT=t;
  earn(ips()*dt);
  acc1+=dt;acc3+=dt;
  if(acc1>=1){acc1=0;custTick();courierTick();orderTick();labTick();if(S.sold>=1&&S.avatar&&!tutOn())maybeStory('orders');drainQueue();updateScene();
    // tickets
    if(S.tickets<ticketCap()){while(t-S.ticketT>=DROPLEN&&S.tickets<ticketCap()){S.tickets++;S.ticketT+=DROPLEN}}else S.ticketT=t;
    // staff
    if(S.staff.tay&&t-S.tayT>=12){S.tayT=t;const st=STAGES[S.stage];if(shelfFree()&&S.cash>=st.binCost*1.5){buyBin();if(tab==='stash'&&!modalOpen)render()}}
    if(S.staff.analyst){const hits=S.pairs.filter(p=>hype(MBY[p.m],t)>=1.8);if(hits.length){hits.forEach(p=>sell(p,true));if(!modalOpen&&tab==='stash')render()}}
    if(refreshListings(false)&&tab==='stash'&&!modalOpen)render();
    updateTicker();
    liveUpdate();
  }
  if(acc3>=3){acc3=0;if(!modalOpen&&(tab==='market'||tab==='hustle'||tab==='drop'))render();save()}
  hud();tutTick();
}

/* ---------- boot ---------- */
function start(snap){
  S=(snap&&snap.S)?Object.assign(fresh(),snap.S):(load()||fresh());
  if(init3D()){start3DScene();if(S3.on)$('#scene').classList.add('is3d')}
  const away=now()-S.last;
  refreshListings(false);
  if(S.pairs.length===0&&S.life===0&&S.sold===0){S.cash=40}
  if(!S.story)S.story={};
  render();updateTicker();updateScene(true);
  if(S.tut===undefined)S.tut=0;if(S.tut<99&&(S.sold>0||S.life>60))S.tut=99;
  ensureQuests();if(streakDue()&&!tutOn())queueModal(streakModal);
  if(!S.avatar){creator(true)}
  else if(!snap&&away>60&&baseIps()>0){
    const secs=Math.min(away,7200),x=baseIps()*secs*.5;
    openModal(`<div class="lbl">Welcome back</div><h3>Your hustles kept going</h3><div class="bigstat">${fmt(x)}</div><p class="hint" style="margin:0;text-align:center">Earned while you were away (${Math.floor(secs/60)} min, max 2 hours).</p><div class="row"><button class="btn" id="wb1">Collect</button><button class="btn primary" id="wb2">2× · watch ad</button></div>`,sh=>{
      sh.querySelector('#wb1').addEventListener('click',()=>{earn(x);closeModal()});
      sh.querySelector('#wb2').addEventListener('click',()=>{closeModal();watchAd('double your away earnings',()=>{earn(x*2);toast('Collected '+fmt(x*2),'good')})});
    });
  }
  setInterval(loop,200);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  window.addEventListener('pagehide',save);
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({S}))}catch(e){}}
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||null);
})();
</script>
